apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: kestrel
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: kestrel-kyc/gateway:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: kestrel-config
            - secretRef:
                name: kestrel-secrets
          resources:
            limits:
              memory: "256Mi"
              cpu: "250m"
            requests:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
