apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: kestrel
  labels:
    app: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
        - name: orchestrator
          image: kestrel-kyc/orchestrator:latest
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: kestrel-config
            - secretRef:
                name: kestrel-secrets
          resources:
            limits:
              memory: "256Mi"
              cpu: "250m"
            requests:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
