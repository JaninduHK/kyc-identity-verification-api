name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, orchestrator, document, biometric, aml, risk, audit, notification]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/kestrel-${{ matrix.service }}:${{ github.sha }} services/${{ matrix.service }}
          docker push $ECR_REGISTRY/kestrel-${{ matrix.service }}:${{ github.sha }}

      - name: Deploy with Helm
        run: |
          helm upgrade --install kestrel-${{ matrix.service }} ./infra/helm/${{ matrix.service }} --set image.tag=${{ github.sha }}
