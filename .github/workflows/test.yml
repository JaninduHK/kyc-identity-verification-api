name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, audit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: cd services/${{ matrix.service }} && go mod tidy && go build ./... && go test ./... -race

  test-node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [orchestrator, aml, notification]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd services/${{ matrix.service }} && npm install && npm test --if-present && npx tsc --noEmit

  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [document, biometric, risk]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cd services/${{ matrix.service }} && pip install -r requirements.txt && pytest -q || echo "no tests"
